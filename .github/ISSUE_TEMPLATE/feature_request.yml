name: Feature request
description: Suggest a focused improvement to agent-stepback-skill
title: "idea: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Review [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md) and check existing issues before proposing a change.
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
      description: Explain the user need and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a concrete, narrow improvement and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Example or scope
      description: Include a non-sensitive example if it helps clarify the proposal.
