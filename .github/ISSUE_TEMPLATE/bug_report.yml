name: Bug report
description: Report a reproducible problem with agent-stepback-skill
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, review [CONTRIBUTING.md](../../blob/main/CONTRIBUTING.md) and check existing issues.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe input and command that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version
      placeholder: e.g. v22.0.0
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include secrets or sensitive transcript content.
